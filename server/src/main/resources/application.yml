server:
  port: ${PORT:8080}

spring:
  application:
    name: arkanoid-server

  # Default DB: H2 in-memory (No installation needed, starts instantly)
  datasource:
    url: jdbc:h2:mem:arkanoiddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# To switch to local MySQL, replace datasource & jpa with:
# spring:
#   datasource:
#     url: jdbc:mysql://localhost:3306/arkanoid_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
#     username: root
#     password: your_mysql_password
#   jpa:
#     database-platform: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    # 256-bit base64-encoded secret key for JWT HMAC-SHA256 signing
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
